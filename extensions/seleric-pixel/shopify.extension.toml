name = "Seleric-pixel"
type = "web_pixel_extension"
uid = "ce7f9021-9dff-1e3e-ee0d-0e249d4b3a03972b8d7f"

runtime_context = "strict"

[settings]
type = "object"

[settings.fields.serverEndpoint]
name = "Server endpoint"
description = "Full URL for the pixel ingestion endpoint (e.g. https://app.example.com/api/ingest/pixel)"
type = "single_line_text_field"
validations = [
  { name = "min", value = "1" }
]

[settings.fields.enableDebug]
name = "Enable debug logging"
description = "Logs pixel events to the console for troubleshooting"
type = "boolean"
