version: '3.8'

services:
  # Seleric-Tracker Application
  app:
    build: .
    container_name: seleric_tracker_app
    restart: unless-stopped
    ports:
      # Bind to localhost only — Nginx reverse-proxies public traffic
      - "127.0.0.1:4201:4201"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4201/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
